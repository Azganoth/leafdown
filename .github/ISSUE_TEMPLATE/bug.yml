name: Bug
description: Track a defect in Leafdown
labels: ["Bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: related_context
    attributes:
      label: Related context
      description: Link related issues, pull requests, documentation, decisions, or prior investigation. Use `y` to generate permalinks for repository files on GitHub.
      placeholder: |
        - Related issue or pull request: #
        - Documentation or decision:

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist for completing and verifying the fix.
      placeholder: |
        - [ ] Defect no longer reproduces
        - [ ] Regression coverage added
        - [ ] Related behavior remains unchanged
        - [ ] Docs updated if needed
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes, logs, screenshots
