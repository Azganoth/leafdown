name: Documentation
description: Report unclear, incorrect, or missing documentation
labels: ["Documentation"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What documentation problem did you encounter?
    validations:
      required: true

  - type: input
    id: document
    attributes:
      label: Document or location
      description: Provide the repository path, URL, document name, or documentation area.
      placeholder: README.md, docs/specification.md, or https://...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is unclear, incorrect, or missing?
      description: Explain the problem and any effect it had on your understanding or contribution.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Describe a correction or improvement if you have one. Proposed wording is optional.

  - type: textarea
    id: related_context
    attributes:
      label: Related context
      description: Link related issues, pull requests, documentation, decisions, or examples.
      placeholder: |
        - Related issue or pull request: #
        - Documentation or example:
