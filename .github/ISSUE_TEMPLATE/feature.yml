name: Feature request
description: Suggest an improvement to Leafdown
labels: ["Feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what is difficult or unavailable today?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What outcome would improve this use case?
    validations:
      required: true

  - type: textarea
    id: proposed_behavior
    attributes:
      label: Proposed behavior
      description: If you have a particular interaction or behavior in mind, describe it here. A proposed solution is not required.

  - type: textarea
    id: alternatives
    attributes:
      label: Existing workaround or alternatives
      description: How do you handle this today, and what alternatives have you considered?

  - type: textarea
    id: related_context
    attributes:
      label: Related context
      description: Link related issues, pull requests, documentation, examples, or prior discussion.
      placeholder: |
        - Related issue or pull request: #
        - Documentation or example:
