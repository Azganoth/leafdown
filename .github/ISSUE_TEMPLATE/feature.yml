name: Feature
description: Implement a product or technical feature
labels: ["Feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What should be implemented?
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: Expected behavior
      description: What should the user or system be able to do?
    validations:
      required: true

  - type: textarea
    id: related_context
    attributes:
      label: Related context
      description: Link related issues, pull requests, documentation, decisions, or prior investigation. Use `y` to generate permalinks for repository files on GitHub.
      placeholder: |
        - Related issue or pull request: #
        - Documentation or decision:

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Checklist for completion.
      placeholder: |
        - [ ] Behavior implemented
        - [ ] Error states handled
        - [ ] Tests/manual checks done
        - [ ] Docs updated if needed
    validations:
      required: true
