name: Release
description: Coordinate a Leafdown release
labels: ["Release"]
body:
  - type: input
    id: target
    attributes:
      label: Target
      description: What release or milestone is this issue coordinating?
      placeholder: MVP, v0.1.0
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What should this release deliver?
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Link the milestone, issues, or pull requests that define the release.
      placeholder: |
        - Milestone:
        - Included issues:
        - Included pull requests:

  - type: textarea
    id: checklist
    attributes:
      label: Release checklist
      description: Track the work needed before publishing the release.
      placeholder: |
        - [ ] Release scope confirmed
        - [ ] Required issues and pull requests complete
        - [ ] Verification complete
        - [ ] Changelog or release notes prepared
        - [ ] Build/package published
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Risks, follow-up work, or anything reviewers should know.
