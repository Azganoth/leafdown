name: Spike
description: Investigate an uncertain question before committing implementation
labels: ["Spike"]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What uncertainty should this spike answer?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this worth investigating now?

  - type: textarea
    id: related_docs
    attributes:
      label: Related docs
      description: Link relevant docs sections, or decisions. Use `y` to generate permalinks on GitHub.
      placeholder: "[Decisions: Example decision](https://github.com/Azganoth/leafdown/blob/aacf982/docs/decisions.md#example-decision)"

  - type: textarea
    id: validate
    attributes:
      label: Validate
      description: What should be inspected, prototyped, or tested?
    validations:
      required: true

  - type: textarea
    id: exit_criteria
    attributes:
      label: Exit criteria
      description: What result is enough to close the spike?
      placeholder: |
        - [ ] Question answered
        - [ ] Tradeoffs recorded
        - [ ] Follow-up issue or docs update created if needed
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What did we learn, decide, or rule out?
