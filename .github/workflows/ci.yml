name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Superseding a run is only safe on pull requests. Pushes to main share one
  # group, so cancelling there discards the merged commit's validation and its
  # Rust cache upload, which PR branches restore from.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-workflows:
    name: Workflow Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  check-frontend:
    name: Frontend Checks
    needs: lint-workflows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run frontend checks
        run: pnpm check:frontend

  check-backend:
    name: Backend Checks
    needs: lint-workflows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          rust-workspace: "./src-tauri -> target"
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Run backend checks
        run: pnpm check:backend

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

  test-e2e-desktop:
    name: Desktop E2E
    needs: lint-workflows
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    env:
      CARGO_PROFILE_DEV_DEBUG: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          rust-workspace: "./src-tauri -> target/desktop-e2e"
          save-rust-cache: ${{ github.ref == 'refs/heads/main' }}

      - name: Build desktop E2E binary
        run: pnpm build:e2e:desktop

      - name: Run desktop E2E suite
        run: pnpm test:e2e:desktop:run -- --workers 1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-e2e-artifacts
          path: e2e/desktop/artifacts/
          retention-days: 7

      - name: Assert clean teardown
        if: always()
        shell: pwsh
        run: |
          # WebView2 host processes outlive the suite by a few seconds; they are
          # not asserted on, but give them time to exit before sampling.
          Start-Sleep -Seconds 10

          $orphans = Get-Process -Name leafdown-e2e, msedgedriver -ErrorAction SilentlyContinue
          $listeners = Get-NetTCPConnection -LocalPort (4445..4448) -State Listen -ErrorAction SilentlyContinue

          if ($orphans -or $listeners) {
            $orphans | Format-Table -AutoSize Name, Id, StartTime
            $listeners | Format-Table -AutoSize LocalAddress, LocalPort, OwningProcess
            throw "Desktop E2E left an orphaned process or a listener on port 4445."
          }

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [lint-workflows, check-frontend, check-backend, test-e2e-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Verify required check results
        env:
          NEEDS_RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.NEEDS_RESULTS);
          if (Object.keys(jobs).length === 0) throw new Error("No prerequisite results were provided.");

          let failed = false;
          for (const [name, { result }] of Object.entries(jobs)) {
            console.log(`${name}: ${result} (expected success)`);
            if (result !== "success") failed = true;
          }
          process.exit(failed ? 1 : 0);
          NODE
