[package]
name = "leafdown"
version = "0.1.0-alpha.3"
description = "A local-first Markdown editor for ordinary files and folders"
authors = ["Azganoth"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "leafdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
desktop-e2e = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }
serde_json = "1.0.154"

[dependencies]
tauri = { version = "2.12.3", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-frame = "1.1.8"
tauri-plugin-zustand = "1.2.1"
tauri-plugin-dialog = "2.8.2"
notify = "9.0.0-rc.5"
tauri-plugin-log = "2.10.1"
tauri-plugin-wdio = { version = "=1.5.0", optional = true }
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }
log = "0.4.34"
dunce = "1.0.5"
time = { version = "0.3.55", features = ["formatting"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
tokio = { version = "1.53.2", features = ["net"] }
trash = { version = "5.2.9", default-features = false, features = ["coinit_apartmentthreaded"] }
encoding_rs = "0.8.42"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.5.3"
tauri-plugin-window-state = "2.5.0"
