[package]
name = "leafdown"
version = "0.1.0-alpha.1"
description = "A local-first Markdown editor for ordinary files and folders"
authors = ["Azganoth"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "leafdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri-plugin-frame = "1.1.8"
tauri-plugin-zustand = "1.2.1"
tauri-plugin-dialog = "2.7.2"
notify = "9.0.0-rc.4"
tauri-plugin-log = "2.9.0"
log = "0.4.33"
dunce = "1.0.5"
time = { version = "0.3.54", features = ["formatting"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4.1"
