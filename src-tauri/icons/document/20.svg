  </g>
  </g>
  <rect x="3.5" y="29.5" width="35" height="31" rx="7.5" fill="#ffffff"/>
  <rect id="markdown-badge" x="2" y="31" width="35" height="31" rx="7" fill="url(#badge-face)"/>
  <path id="markdown-glyph" d="M 6.4 54.4 V 38.4 H 9.6 V 41.6 H 12.8 V 44.8 H 16 V 41.6 H 19.2 V 38.4 H 22.4 V 54.4 H 19.2 V 44.8 H 16 V 48 H 12.8 V 44.8 H 9.6 V 54.4 Z M 28.8 38.4 H 32 V 48 H 35.2 L 30.4 56 L 25.6 48 H 28.8 Z" fill="#ffffff"/>
