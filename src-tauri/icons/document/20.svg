      <use xlink:href="#leaf-body" fill="url(#body-light)"/>
      <g clip-path="url(#body-clip)">
        <path d="M 159 585 C 154 511 184 460 246 423 C 326 382 404 362 487 314 C 552 277 603 226 650 142" fill="none" stroke="#004f3c" stroke-width="43" stroke-opacity="0.72" filter="url(#fold-shadow)"/>
