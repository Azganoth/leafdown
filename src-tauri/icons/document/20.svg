    </filter>
    <filter id="curl-shadow" x="-30%" y="-60%" width="160%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <linearGradient id="page-face" x1="20" y1="12" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e5e9e6"/>
    </linearGradient>
    <linearGradient id="badge-face" x1="8" y1="34" x2="30" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#27c986"/>
      <stop offset="0.5" stop-color="#089a68"/>
      <stop offset="1" stop-color="#006449"/>
    </linearGradient>
  </defs>
  <path id="document-page" d="M 18 4.5 H 43.5 C 50.4 4.5 56 10.1 56 17 V 54.5 C 56 57.3 54 59.5 51 59.5 H 18 C 15.2 59.5 13 57.3 13 54.5 V 9.5 C 13 6.7 15.2 4.5 18 4.5 Z" fill="url(#page-face)" stroke="#aeb5af" stroke-width="3.2" stroke-linejoin="round"/>
  <g transform="translate(14.293333 7.506667) scale(0.053333333)">
